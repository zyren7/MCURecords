<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Peso Money Counter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&family=Caprasimo&display=swap" rel="stylesheet">
<style>
:root{--bg:#ffe82e;--surface:#fffbe3;--ink:#0b3d1e;--muted:#4a5a1f;--line:#e6cd14;--accent:#077a33;--accent-ink:#fff;--err:#b3261e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b2d19;--surface:#123b22;--ink:#fff3a3;--muted:#cfd98f;--line:#22512f;--accent:#ffe82e;--accent-ink:#0b2d19;--err:#ff8a80}}
:root[data-theme="dark"]{--bg:#0b2d19;--surface:#123b22;--ink:#fff3a3;--muted:#cfd98f;--line:#22512f;--accent:#ffe82e;--accent-ink:#0b2d19;--err:#ff8a80}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.5}
main{max-width:560px;margin:0 auto;padding:28px 20px 48px}
.hidden{display:none!important}
h1,h2,.sum .big{font-family:"Caprasimo","Bricolage Grotesque",Georgia,serif;font-weight:400;color:var(--accent)}
h1{font-size:clamp(2rem,8vw,3rem);line-height:1.05;margin:0 0 8px}
h2{font-size:1.4rem;margin:28px 0 10px}
.pin{display:block;color:var(--accent);margin-bottom:10px}
.sub{color:var(--muted);margin:0 0 20px}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.fields .full{grid-column:1/-1}
.fields label{display:block;font-weight:600;margin-bottom:6px}
.fields input{width:100%;font:inherit;font-size:1.05rem;color:var(--ink);background:var(--surface);border:2px solid transparent;border-radius:12px;padding:10px 14px;outline:none}
.fields input:focus{border-color:var(--accent)}
.err{color:var(--err);font-weight:600;min-height:1.5em;margin:4px 0 0}
.sum{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:12px 0;margin-bottom:8px;border-bottom:2px solid var(--ink);display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.sum .big{font-size:2.4rem;line-height:1}
.sum .lbl{color:var(--muted);font-size:.9rem}
.sum .r{text-align:right}
.sum .r b{font-size:1.3rem}
.row{display:grid;grid-template-columns:1fr auto;align-items:center;gap:8px 12px;background:var(--surface);border:0;border-radius:14px;padding:10px 14px;margin-bottom:8px}
.d{display:inline-block;font-weight:800;font-size:1.15rem;background:var(--c);color:var(--t,#fff);padding:1px 14px;border-radius:999px}
.line{color:var(--muted);font-size:.9rem}
.ctl{display:flex;align-items:center;gap:6px}
.n{width:68px;height:44px;text-align:center;font:inherit;font-weight:800;font-size:1.25rem;color:var(--ink);background:transparent;border:0;border-bottom:2px solid var(--line);border-radius:0;padding:0;outline:none}
.n:focus{border-color:var(--accent)}
.ctl button{width:44px;height:44px;border-radius:50%;border:2px solid var(--accent);background:transparent;color:var(--accent);font:inherit;font-size:1.5rem;font-weight:800;line-height:1;cursor:pointer;padding:0}
.ctl button.plus{background:var(--accent);color:var(--accent-ink)}
.ctl button:disabled{opacity:.3;cursor:not-allowed}
button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.btn{display:block;width:100%;height:48px;margin-top:10px;font:inherit;font-weight:700;border-radius:999px;cursor:pointer;border:2px solid var(--accent);background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line);font-weight:600}
.x{border:0;background:transparent;color:var(--err);font:inherit;font-weight:800;font-size:1.2rem;cursor:pointer;padding:0 4px}
.card{background:var(--surface);border:0;border-radius:16px;padding:6px 16px;margin-bottom:16px}
.info{display:flex;justify-content:space-between;gap:16px;padding:10px 0;border-bottom:1px solid var(--line)}
.info:last-child{border-bottom:0}
.info span{color:var(--muted)}
.info b{text-align:right;word-break:break-word}
.info.hl span{color:var(--ink);font-weight:600}
.info.hl b,.pos b{color:var(--accent)}
.neg b{color:var(--err)}
.rrow{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px dashed var(--line)}
.rrow:last-of-type{border-bottom:0}
.gtotal{display:flex;justify-content:space-between;align-items:baseline;border-top:2px solid var(--ink);margin-top:6px;padding:12px 0 8px;font-weight:800;font-size:1.3rem}
.tot{text-align:right;font-weight:800;margin:4px 0 10px}
.rec{display:flex;flex-direction:column;align-items:flex-start;gap:2px;width:100%;text-align:left;font:inherit;color:var(--ink);background:var(--surface);border:0;border-radius:14px;padding:12px 14px;margin-bottom:8px;cursor:pointer}
.rec span{color:var(--muted);font-size:.9rem}
@media print{body{background:#fff;color:#000}.noprint{display:none!important}.card{border:1px solid #999}}
</style>
</head>
<body>
<main id="pageStart">
  <svg class="pin" width="34" height="42" viewBox="0 0 36 44" aria-hidden="true"><path d="M18 2C9 2 2 9 2 18c0 12 16 24 16 24s16-12 16-24C34 9 27 2 18 2z" fill="currentColor"/><circle cx="18" cy="18" r="6" style="fill:var(--bg)"/></svg>
  <h1>Start Duty</h1>
  <p class="sub">Enter your duty details and starting cash on hand.</p>
  <div class="fields">
    <div class="full"><label for="sName">Name</label><input id="sName" type="text" autocomplete="name" placeholder="Your full name"></div>
    <div class="full"><label for="sTime">Time of duty</label><input id="sTime" type="time"></div>
    <div class="full"><label for="sCash">Starting cash on hand</label><input id="sCash" type="text" inputmode="decimal" placeholder="0"></div>
    <div class="full"><label for="loc">MCU Pastil Spot</label><input id="loc" type="text" value="PASTIL" readonly></div>
  </div>
  <p class="err" id="sErr" role="alert"></p>
  <button id="startBtn" class="btn" type="button">Start duty</button>
  <button id="openRec" class="btn ghost" type="button">Saved records</button>
</main>

<main id="pageCount" class="hidden">
  <h1>Peso Money Counter</h1>
  <p class="sub" id="dutyInfo"></p>
  <div class="sum" aria-live="polite">
    <div><div class="lbl">Cash counted</div><div class="big" id="total">₱0</div></div>
    <div class="r"><div class="lbl">Total pieces</div><b id="pieces">0</b></div>
  </div>
  <div id="list"></div>
  <button id="reset" class="btn ghost" type="button">Reset counts</button>

  <h2>Expenses</h2>
  <div id="expList"></div>
  <div class="tot" id="expTotal"></div>
  <div class="fields">
    <input id="eDesc" type="text" placeholder="Expenses" aria-label="Expense description">
    <input id="eAmt" type="text" inputmode="decimal" placeholder="Amount" aria-label="Expense amount">
  </div>
  <p class="err" id="eErr" role="alert"></p>
  <button id="addExp" class="btn ghost" type="button">Add expense</button>

  <h2>End duty</h2>
  <div class="fields">
    <div class="full"><label for="sPastil">Pastil sales</label><input id="sPastil" type="text" inputmode="decimal" placeholder="0"></div>
    <div class="full"><label for="sEggs">Eggs sales</label><input id="sEggs" type="text" inputmode="decimal" placeholder="0"></div>
    <div class="full"><label for="sProd">Product sales</label><input id="sProd" type="text" inputmode="decimal" placeholder="0"></div>
    <div class="full"><label for="eTime">End Time of Duty (Based on TimeMark)</label><input id="eTime" type="time"></div>
  </div>
  <p class="err" id="endErr" role="alert"></p>
  <button id="endBtn" class="btn" type="button">End duty &amp; view output</button>
</main>

<main id="pageResult" class="hidden">
  <h1>End Duty's Summarization</h1>
  <p class="sub">Summary of this duty.</p>
  <div id="outBody"></div>
  <p class="sub noprint" id="saveNote"></p>
  <button id="print" class="btn noprint" type="button">Print</button>
  <button id="done" class="btn ghost noprint" type="button">Start new duty</button>
</main>

<script>
var DENOMS=[1000,500,200,100,50,20,10,5,1];
var COLORS={1000:"#2f6fd0",500:"#e0b400",200:"#2e9d57",100:"#8a4fc9",50:"#d6475f",20:"#e8802a",10:"#6b7780",5:"#6b7780",1:"#6b7780"};
var MAX=999,KEY="pesoRecords",DKEY="pesoDuty";
var counts={};DENOMS.forEach(function(d){counts[d]=0});
var duty=null,fromRec=false;
var $=function(id){return document.getElementById(id)};
var r2=function(n){return Math.round(n*100)/100};
var fmt=function(n){return n.toLocaleString("en-PH",{maximumFractionDigits:2})};
var peso=function(n){return (n<0?"−":"")+"₱"+fmt(Math.abs(n))};
var esc=function(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})};
function time12(v){var p=v.split(":"),h=parseInt(p[0],10),ap=h>=12?"PM":"AM";h=h%12;if(h===0)h=12;return h+":"+p[1]+" "+ap}
function amt(id){var v=$(id).value.replace(/,/g,"").trim();if(v==="")return 0;var n=Number(v);return isFinite(n)&&n>=0?r2(n):NaN}
function show(id){["pageStart","pageCount","pageResult","pageRecords"].forEach(function(p){$(p).classList.toggle("hidden",p!==id)});window.scrollTo(0,0)}
function loadRecords(){try{var r=JSON.parse(localStorage.getItem(KEY)||"[]");return Array.isArray(r)?r:[]}catch(e){return []}}
function saveRecord(rec){try{var r=loadRecords();r.unshift(rec);localStorage.setItem(KEY,JSON.stringify(r.slice(0,200)));return true}catch(e){console.warn("Could not save to localStorage",e);return false}}
function persist(){if(!duty)return;duty.counts=counts;try{localStorage.setItem(DKEY,JSON.stringify(duty))}catch(e){}}
function totals(){var t=0,p=0;DENOMS.forEach(function(d){t+=counts[d]*d;p+=counts[d]});return {total:t,pieces:p}}

DENOMS.forEach(function(d){
  var row=document.createElement("div");
  row.className="row";row.style.setProperty("--c",COLORS[d]);if(d===500)row.style.setProperty("--t","#2a2200");
  row.innerHTML='<div><div class="d">₱'+fmt(d)+'</div><div class="line" id="s'+d+'">₱0</div></div>'+
    '<div class="ctl"><button type="button" id="m'+d+'" aria-label="Remove one ₱'+d+'">−</button>'+
    '<input class="n" id="n'+d+'" type="text" inputmode="numeric" maxlength="3" value="0" aria-label="Count of ₱'+d+'">'+
    '<button type="button" class="plus" id="p'+d+'" aria-label="Add one ₱'+d+'">+</button></div>';
  $("list").appendChild(row);
  $("m"+d).onclick=function(){change(d,-1)};
  $("p"+d).onclick=function(){change(d,1)};
  var inp=$("n"+d);
  inp.onfocus=function(){this.select()};
  inp.oninput=function(){var v=this.value.replace(/\D/g,"").slice(0,3);this.value=v;counts[d]=v===""?0:Math.min(MAX,parseInt(v,10));render()};
  inp.onblur=function(){this.value=counts[d]};
});
function change(d,delta){counts[d]=Math.max(0,Math.min(MAX,counts[d]+delta));$("n"+d).value=counts[d];render()}
function render(){
  DENOMS.forEach(function(d){var n=counts[d];
    if(document.activeElement!==$("n"+d))$("n"+d).value=n;
    $("s"+d).textContent="₱"+fmt(n*d);$("m"+d).disabled=n===0;$("p"+d).disabled=n===MAX});
  var t=totals();$("total").textContent="₱"+fmt(t.total);$("pieces").textContent=fmt(t.pieces);persist();
}
function renderExp(){
  var box=$("expList"),tot=0;box.innerHTML="";
  (duty?duty.expenses:[]).forEach(function(e,i){
    tot+=e.a;
    var row=document.createElement("div");row.className="rrow";
    var s=document.createElement("span");s.textContent=e.d;
    var b=document.createElement("b");b.textContent=peso(e.a)+" ";
    var x=document.createElement("button");x.type="button";x.className="x";x.textContent="×";x.setAttribute("aria-label","Remove expense");
    x.onclick=function(){duty.expenses.splice(i,1);persist();renderExp()};
    b.appendChild(x);row.appendChild(s);row.appendChild(b);box.appendChild(row);
  });
  $("expTotal").textContent="Total expenses: "+peso(r2(tot));
}
function enterCount(){
  $("dutyInfo").textContent=duty.name+" · on duty "+time12(duty.start)+" · Starting cash "+peso(duty.startCash);
  render();renderExp();show("pageCount");
}

$("startBtn").onclick=function(){
  var name=$("sName").value.trim(),t=$("sTime").value,cash=amt("sCash");
  var err=!name?"Please enter your name.":!t?"Please enter your time of duty.":($("sCash").value.trim()===""||isNaN(cash))?"Please enter your starting cash on hand (0 if none).":"";
  $("sErr").textContent=err;if(err)return;
  duty={name:name,start:t,startCash:cash,expenses:[]};
  DENOMS.forEach(function(d){counts[d]=0;$("n"+d).value=0});
  persist();enterCount();
};
$("addExp").onclick=function(){
  var a=amt("eAmt");
  if(!(a>0)){$("eErr").textContent="Enter an expense amount greater than 0.";return}
  $("eErr").textContent="";
  duty.expenses.push({d:$("eDesc").value.trim()||"Expense",a:a});
  $("eDesc").value="";$("eAmt").value="";persist();renderExp();
};
$("reset").onclick=function(){DENOMS.forEach(function(d){counts[d]=0;$("n"+d).value=0});render()};

$("endBtn").onclick=function(){
  var end=$("eTime").value,P=amt("sPastil"),E=amt("sEggs"),Q=amt("sProd");
  var err=!end?"Please enter your end time of duty (based on TimeMark).":(isNaN(P)||isNaN(E)||isNaN(Q))?"Enter valid sales amounts (0 if none).":"";
  $("endErr").textContent=err;if(err)return;
  var now=new Date(),t=totals(),ex=0;
  duty.expenses.forEach(function(e){ex+=e.a});
  var sales=r2(P+E+Q),expected=r2(duty.startCash+sales-ex);
  var rec={name:duty.name,duty:duty.start,endDuty:end,loc:$("loc").value,
    date:now.toLocaleDateString("en-PH",{weekday:"long",year:"numeric",month:"long",day:"numeric"}),
    startCash:duty.startCash,pastil:P,eggs:E,prod:Q,sales:sales,expenses:duty.expenses.slice(),expTotal:r2(ex),expected:expected,
    counts:JSON.parse(JSON.stringify(counts)),total:t.total,pieces:t.pieces,variance:r2(t.total-expected),savedAt:now.toISOString()};

  /* Save to the device's console log */
  ["===== MCU Pastil Spot Duty Summary =====","Name: "+rec.name,"Time of duty: "+time12(rec.duty),
   "End Time of Duty (Based on TimeMark): "+time12(end),"Location (MCU Pastil Spot): "+rec.loc,"Date: "+rec.date].forEach(function(l){console.log(l)});
  console.table(DENOMS.map(function(d){return {Denomination:"₱"+d,Count:counts[d],Subtotal:"₱"+fmt(d*counts[d])}}));
  ["Pastil: "+peso(P),"Eggs: "+peso(E),"Product sales: "+peso(Q),"Total sales: "+peso(sales),"Starting cash: "+peso(rec.startCash),
   "Expenses: "+peso(rec.expTotal),"Expected cash: "+peso(expected),"Cash counted: "+peso(t.total),"Cash variance: "+peso(rec.variance),"Total pieces: "+t.pieces
  ].forEach(function(l){console.log(l)});

  var saved=saveRecord(rec);
  try{localStorage.removeItem(DKEY)}catch(e){}
  fromRec=false;fillOutput(rec);
  $("saveNote").textContent=saved?"Saved to this device (localStorage).":"Could not save to this device.";
  $("done").textContent="Start new duty";show("pageResult");
};

function fillOutput(rec){
  var R=function(l,v,c){return '<div class="info'+(c?" "+c:"")+'"><span>'+l+'</span><b>'+v+'</b></div>'};
  var sc=rec.startCash||0,ex=rec.expTotal||0,sales=rec.sales||0;
  var exp=rec.expected!==undefined?rec.expected:r2(sc+sales-ex),v=rec.variance!==undefined?rec.variance:r2(rec.total-exp);
  var h='<div class="card">'+R("Name",esc(rec.name))+R("Time of duty",time12(rec.duty))+R("End Time of Duty (Based on TimeMark)",time12(rec.endDuty))+R("MCU Pastil Spot",esc(rec.loc))+R("Date today",esc(rec.date))+'</div>';
  h+='<div class="card">'+R("Pastil",peso(rec.pastil||0))+R("Eggs",peso(rec.eggs||0))+R("Product sales",peso(rec.prod||0))+R("Total sales",peso(sales),"hl")+'</div>';
  var ee="";(rec.expenses||[]).forEach(function(e){ee+=R("&nbsp;&nbsp;"+esc(e.d),"−"+peso(e.a))});
  h+='<div class="card">'+R("Starting cash on hand",peso(sc))+R("Total sales","+"+peso(sales))+R("Expenses","−"+peso(ex))+ee+
    R("Expected cash",peso(exp),"hl")+R("Cash counted",peso(rec.total),"hl")+
    R("Cash variance ("+(v>0?"over":v<0?"short":"balanced")+")",(v>0?"+":"")+peso(v),v<0?"neg":"pos")+
    R("Cash to remit (counted − starting cash)",peso(r2(rec.total-sc)))+'</div>';
  var dh="";DENOMS.forEach(function(d){var n=rec.counts[d]||0;if(n>0)dh+='<div class="rrow"><span>₱'+fmt(d)+' × '+fmt(n)+'</span><b>₱'+fmt(d*n)+'</b></div>'});
  h+='<div class="card">'+(dh||'<div class="rrow"><span>No bills or coins counted</span><b>₱0</b></div>')+
    '<div class="gtotal"><span>Cash counted</span><span>'+peso(rec.total)+'</span></div>'+R("Total pieces",fmt(rec.pieces))+'</div>';
  $("outBody").innerHTML=h;
}
$("print").onclick=function(){window.print()};
$("done").onclick=function(){
  if(fromRec){renderRecords();show("pageRecords");return}
  duty=null;DENOMS.forEach(function(d){counts[d]=0;$("n"+d).value=0});
  ["sCash","sTime","sPastil","sEggs","sProd","eTime","eDesc","eAmt"].forEach(function(id){$(id).value=""});
  render();show("pageStart");
};

var pageRec=document.createElement("main");
pageRec.id="pageRecords";pageRec.className="hidden";
pageRec.innerHTML='<h1>Saved Records</h1><p class="sub">Outputs saved on this device.</p><div id="recList"></div><button id="recBack" class="btn" type="button">Back</button><button id="recClear" class="btn ghost" type="button">Clear all records</button>';
document.body.appendChild(pageRec);
function renderRecords(){
  var recs=loadRecords(),box=$("recList");box.innerHTML="";
  if(!recs.length){box.innerHTML='<p class="sub">No saved records yet.</p>';return}
  recs.forEach(function(r){
    var b=document.createElement("button");b.type="button";b.className="rec";
    var a=document.createElement("b");a.textContent=r.name+" — Sales "+peso(r.sales||0);
    var s=document.createElement("span");s.textContent=r.date+" · "+time12(r.duty)+" – "+time12(r.endDuty);
    b.appendChild(a);b.appendChild(s);
    b.onclick=function(){fromRec=true;fillOutput(r);$("saveNote").textContent="Saved record from this device.";$("done").textContent="Back to records";show("pageResult")};
    box.appendChild(b);
  });
}
$("openRec").onclick=function(){renderRecords();show("pageRecords")};
$("recBack").onclick=function(){show(duty?"pageCount":"pageStart")};
$("recClear").onclick=function(){
  var b=$("recClear");
  if(b.dataset.armed!=="1"){b.dataset.armed="1";b.textContent="Tap again to clear all";return}
  try{localStorage.removeItem(KEY)}catch(e){}
  b.dataset.armed="";b.textContent="Clear all records";renderRecords();
};

/* Resume an unfinished duty after a reload */
try{var sv=JSON.parse(localStorage.getItem(DKEY)||"null");
  if(sv&&sv.name&&sv.expenses){duty=sv;DENOMS.forEach(function(d){counts[d]=(sv.counts&&sv.counts[d])||0})}}catch(e){}
if(duty)enterCount();else{render();show("pageStart")}
</script>
</body>
</html>
